              ('v27.0', 437497045, 'pocket-lahm-web-v27.0-medals-rename-fix.zip', 721521168, 'bbabda72c5c04e2394bed38f972c7d27be9bb2e04417fc48eca088e09d28629a'),
              ('v27.0', 437497045, 'pocket-lahm-web-v27.0-rounded-panels-fix.zip', 721555432, '0fa659bcf21b88cd52b01cf8523fa40e0809534330cadb5b48e5289acb826567'),
