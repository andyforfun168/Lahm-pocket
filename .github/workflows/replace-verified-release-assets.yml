              ('v27.0', 437497045, 'pocket-lahm-web-v27.0-journal-layout-update.zip', 721694817, '5f242aa455ce94a25ab3d9c5a563133ae34a05d8b9b3b2a3606b019e662d6cb9'),
              ('v27.0', 437497045, 'pocket-lahm-web-v27.0-travel-album-update.zip', 722134740, '777957f5dd897bffc825780717df67fe610ef537cc283abba9a9f853bf8c6112'),
