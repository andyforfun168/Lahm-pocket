  remaining:
    name: Replace historical batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: first
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        batch: [1, 2, 3, 4, 5, 6]
    permissions:
      contents: write
    steps:
      - name: Verify and replace release packages
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: '${{ matrix.batch }}'
        run: *replace
