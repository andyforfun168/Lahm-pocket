              ('v28.0', 438085389, 'pocket-lahm-web-v28.0-binder-fix.zip', 723254063, '5226602b1aa68ec966a5d3e9928b4f44f83f28efe160a1793cba4a044945c706'),
              ('v28.0', 438085389, 'pocket-lahm-web-v28.0-webkit-fix.zip', 723331464, 'f1d17315cdc82b0bc3b56620fb17fff0469c6e8bc8e7f5dcb99c618cd5eabd8f'),
              ('v28.2', 438647957, 'pocket-lahm-web-v28.2.zip', 725797716, '0bff0f22f4ee5c53ad0d690c59b933c3e576651bf68298389ed1752fdd2cb4f5'),
              ('v28.2', 438647957, 'pocket-lahm-web-v28.2-light-update.zip', 725839873, '5c86340190138cefdbe0542fbcba507be19e1d92d9a6906d215684d4a0107c61'),
