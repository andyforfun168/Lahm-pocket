name: Deploy Pocket Lahm

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download verified release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          metadata = json.load(open('tools/deploy/release-package.json'))
          subprocess.run(['gh', 'release', 'download', metadata['tag'], '--pattern', metadata['asset']], check=True)
          subprocess.run(['python3', 'tools/deploy/prepare_site.py', metadata['asset'], '_site'], check=True)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        id: pages_artifact
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..15}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fx "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact $ARTIFACT_ID is not yet available"
          exit 1
      - name: Publish Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: '600000'

      - name: Allow artifact metadata to settle before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - name: Retry Pages publication after artifact indexing
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: '600000'
